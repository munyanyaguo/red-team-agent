worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # -----------------------------------------------------------------------
    # Performance
    # -----------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;
    server_tokens off;

    # -----------------------------------------------------------------------
    # Gzip Compression
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Rate Limiting Zones
    # -----------------------------------------------------------------------
    # General API rate limit: 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

    # Auth endpoints: 5 requests/minute per IP (stricter for brute-force protection)
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

    # Scan endpoints: 2 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_scan:10m rate=2r/m;

    # -----------------------------------------------------------------------
    # Upstream Backends
    # -----------------------------------------------------------------------
    upstream redteam_api {
        server redteam_app:5000;
    }

    upstream n8n {
        server n8n:5678;
    }

    upstream grafana {
        server grafana:3000;
    }

    # -----------------------------------------------------------------------
    # Include server blocks
    # -----------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
