global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  # -----------------------------------------------------------------------
  # Red Team API Application
  # -----------------------------------------------------------------------
  - job_name: 'redteam-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['redteam_app:5000']
        labels:
          service: 'redteam-api'
          environment: 'production'

  # -----------------------------------------------------------------------
  # Prometheus Self-Monitoring
  # -----------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # -----------------------------------------------------------------------
  # Nginx
  # -----------------------------------------------------------------------
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
        labels:
          service: 'nginx'
